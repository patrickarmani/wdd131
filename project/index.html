<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
        name="description"
        content="Website with purpose to provides information about medicinal plants, their recommended uses, and their scientific names.">
        <title>Doctor Nature - Plants that heal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <img src="images/logo.webp" alt="Medicinal Plants logo" width="300" height="300">
            <span>Doctor Nature</span>
        </a>

        <button id="menu-button" aria-label="Open navigation menu">
            ☰
        </button>

        <nav>
            <!-- links -->
        </nav>
    </header>

    <main>
        <div class="hero-image">
            <picture>
                <source
                    media="(min-width: 768px)"
                    srcset="images/hero3.webp"
                >
                <img
                    src="images/hero3.webp"
                    alt="Medicinal plants growing in a natural garden"
                    width="400"
                    height="220"
                >
            </picture>
        </div>

        <section class="hero-content">
            <h1>Discover the Power of Medicinal Plants</h1>

            <p>
                Learn how plants have traditionally been used to support
                health and well-being.
            </p>

            <a
                href="plants.html"
                class="hero-button"
                aria-label="Explore medicinal plants"
            >
                <span class="visually-hidden">Explore Plants</span>
            </a>
        </section>

        <section class="featured-content">
            <picture>
                <source
                    media="(min-width: 768px)"
                    srcset="images/featured.webp"
                >
                <img
                    src="images/central-image.webp"
                    alt="A variety of medicinal plants in a garden"
                    width="300"
                    height="180"
                >

        </section>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Patrick Marcelo A. S. Armani - Brazil
        </p>
    
        <p>
            Last Modification: <span id="lastModified"></span>
        </p>

    </footer>
</body>
</html>
